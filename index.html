<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>くらべてみよう</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* レイアウト：上に質問文、下に2つの大きな選択肢（横向き=左右／縦向き=上下）。白地のみ・装飾なし。 */
:root {
  --bg: #ffffff;        /* 背景（白） */
  --ink: #222831;       /* 文字 */
  --line: #d3d9e0;      /* 選択肢のふち */
  --press: #eef2f6;     /* 押した瞬間の色 */
  --key: #d6450f;       /* 質問文のキーワード（おおきい 等） */
  --maru: #e03131;      /* 〇 の色 */
  --batsu: #1f5fbf;     /* × の色 */
  --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Hiragino Sans", "Meiryo", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  overflow: hidden; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 2.5vmin;
  padding-inline: max(16px, 3vmin); padding-block: 2vmin 3vmin;
}

/* ---------- 質問文 ---------- */
#question {
  margin: 0; text-align: center; font-weight: 900; line-height: 1.2;
  font-size: clamp(34px, 8vmin, 84px); letter-spacing: .04em;
  text-wrap: balance;
}
#question .key { color: var(--key); }

/* ---------- 選択肢 ---------- */
#choices {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: 1fr 1fr; gap: 3vmin;
}
@media (orientation: portrait) {
  #choices { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
}
.choice {
  position: relative; min-width: 0; min-height: 0; margin: 0; padding: 0;
  container-type: size;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); color: inherit; font: inherit;
  border: max(4px, .7vmin) solid var(--line); border-radius: 4vmin;
  cursor: pointer; overflow: hidden;
  transition: background-color .1s;
}
.choice:active { background: var(--press); }
.choice:focus-visible { outline: 6px solid var(--key); outline-offset: 4px; }
.choice.is-correct { border-color: var(--maru); }
.choice.is-wrong   { border-color: var(--batsu); }
.choice.align-start { justify-content: flex-start; padding-left: 6cqw; }

/* 絵文字（大きさは --s ＝ 0〜1 で指定） */
.emoji { font-size: calc(var(--s) * 78cqmin); line-height: 1; }

/* 画像に差し替えたとき（--s で大きさ） */
.pic {
  width: calc(var(--s) * 92cqw); height: calc(var(--s) * 92cqh);
  object-fit: contain; pointer-events: none; -webkit-user-drag: none;
}

/* おおい・すくない：同じ大きさの絵文字を並べる */
.many {
  width: 92%; display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
  gap: 2cqmin 4cqmin; font-size: var(--fs); line-height: 1;
}

/* ながい・みじかい：えんぴつ */
.pencil { width: calc(var(--len) * 86cqw); height: 17cqmin; display: flex; }
.pencil .eraser { width: 9cqmin; background: #f4a6b8; border-radius: 3cqmin 0 0 3cqmin; flex: none; }
.pencil .band   { width: 3cqmin; background: #b8bec6; flex: none; }
.pencil .body   { flex: 1; background: var(--c); }
.pencil .tip {
  width: 15cqmin; flex: none;
  background: linear-gradient(to right, #f1d3a6 72%, #3a3a3a 72%);
  clip-path: polygon(0 0, 100% 50%, 0 100%);
}

/* ひろい・せまい：同じ大きさの人と、広さのちがう場所 */
.area {
  width: calc(var(--w) * 90cqw); height: calc(var(--h) * 90cqh);
  background: var(--c); border-radius: 3cqmin;
  display: flex; align-items: center; justify-content: center;
  font-size: 16cqmin; line-height: 1;
}

/* ---------- 〇 × フィードバック ---------- */
#feedback {
  position: fixed; inset: 0; z-index: 10; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
.mark { width: 72vmin; aspect-ratio: 1; max-width: 100%; opacity: .72; animation: pop .35s ease-out both; }
.maru { box-sizing: border-box; border-radius: 50%; border: 10vmin solid var(--maru); }
.batsu { position: relative; }
.batsu::before, .batsu::after {
  content: ""; position: absolute; left: 50%; top: 0;
  width: 10vmin; height: 100%; margin-left: -5vmin;
  background: var(--batsu); border-radius: 5vmin;
}
.batsu::before { transform: rotate(45deg); }
.batsu::after  { transform: rotate(-45deg); }
.mark.fade { opacity: .12; transition: opacity 1s ease; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); } }

/* 操作ロック（クールタイム中など） */
#blocker { position: fixed; inset: 0; z-index: 20; background: transparent; }

/* クールタイムの残り（先生向けの細いバー） */
#cooldown {
  position: fixed; left: 0; bottom: 0; z-index: 21;
  height: max(6px, 1.2vmin); width: 100%; background: var(--line);
  transform-origin: left center;
}
#cooldown.run { animation: shrink var(--t) linear forwards; }
@keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* ---------- スタート画面 ---------- */
#start {
  position: fixed; inset: 0; z-index: 30; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6vmin;
}
#start h1 { margin: 0; font-size: clamp(40px, 10vmin, 110px); font-weight: 900; letter-spacing: .08em; }
#startBtn {
  font: inherit; font-weight: 900; font-size: clamp(30px, 7vmin, 72px); color: #fff;
  background: var(--key); border: 0; border-radius: 999px; padding: 3vmin 10vmin; cursor: pointer;
}
#startBtn:focus-visible { outline: 6px solid var(--ink); outline-offset: 6px; }

@media (prefers-reduced-motion: reduce) {
  .mark { animation: none; }
  .mark.fade { transition: none; }
}
</style>
</head>
<body>

<div id="app">
  <h2 id="question" aria-live="polite"></h2>
  <div id="choices">
    <button class="choice" id="choice0" type="button"></button>
    <button class="choice" id="choice1" type="button"></button>
  </div>
</div>

<div id="feedback" aria-hidden="true"></div>
<div id="blocker" hidden></div>
<div id="cooldown" hidden></div>

<div id="start">
  <h1>くらべてみよう</h1>
  <button id="startBtn" type="button">▶ はじめる</button>
</div>

<script>
/* =========================================================
   せってい（先生が変えられる数値）
   ========================================================= */
const CONFIG = {
  correctWaitMs: 2500,   // 正解後、次の問題へ進むまで
  cooldownMs: 5000,      // 不正解後のクールタイム（操作できない時間）
  batsuFadeMs: 1500,     // × を大きく見せる時間（その後うすくなる）
  volume: 0.28           // 正解音の大きさ（0〜1）
};

/* =========================================================
   選択肢の「見た目」の書き方
   ---------------------------------------------------------
   どの選択肢も、次のどれかのオブジェクトで表します。
   画像に差し替えるときは image を足すだけでOK
   （image があれば絵文字より優先して表示されます）。

   { type:'emoji',  emoji:'🍎', size:0.9 }          … 1つの絵（size 0〜1）
   { type:'many',   emoji:'🍎', count:6 }           … 同じ絵を count 個
   { type:'pencil', length:0.9, color:'#f2c94c' }   … えんぴつ（length 0〜1）
   { type:'area',   w:0.9, h:0.8, color:'#bfe3b4', emoji:'🧒' } … 場所の広さ
   { image:'img/apple.png', size:0.9, alt:'りんご' } … 画像（size 0〜1）
   ========================================================= */

const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* =========================================================
   問題のデータ
   words[0] が items()[0]、words[1] が items()[1] の答えになります。
   例：words:['おおきい','ちいさい'] なら items()[0] が大きいほう。
   ========================================================= */
const CONCEPTS = [
  {
    id: 'size',
    words: ['おおきい', 'ちいさい'],
    items() {
      const e = pick(['🍎', '🐶', '⚽', '🍙', '🚗', '🐟', '🌻']);
      return [
        { type: 'emoji', emoji: e, size: 0.9 },
        { type: 'emoji', emoji: e, size: 0.35 }
      ];
    }
  },
  {
    id: 'length',
    words: ['ながい', 'みじかい'],
    items() {
      const c = pick(['#f2c94c', '#6fb3e8', '#7cc576', '#f28c8c']);
      return [
        { type: 'pencil', length: 0.95, color: c },
        { type: 'pencil', length: 0.42, color: c }
      ];
    },
    alignStart: true   // 左はしをそろえて比べやすくする
  },
  {
    id: 'width',
    words: ['ひろい', 'せまい'],
    items() {
      const [color, emoji] = pick([['#bfe3b4', '🧒'], ['#bfe0f5', '🐟'], ['#f3dfc1', '🐱']]);
      return [
        { type: 'area', w: 0.92, h: 0.85, color, emoji },
        { type: 'area', w: 0.32, h: 0.38, color, emoji }
      ];
    }
  },
  {
    id: 'amount',
    words: ['おおい', 'すくない'],
    items() {
      const e = pick(['🍎', '🍓', '⭐', '🐟', '🍬', '🌷']);
      const [many, few] = pick([[8, 2], [7, 1], [6, 2], [9, 3]]);
      return [
        { type: 'many', emoji: e, count: many },
        { type: 'many', emoji: e, count: few }
      ];
    }
  },
  {
    id: 'weight',
    words: ['おもい', 'かるい'],
    items() {
      const [heavy, light] = pick([['🐘', '🐭'], ['🚗', '🚲'], ['🍉', '🍓'], ['🪨', '🪶'], ['🐻', '🐦']]);
      return [
        { type: 'emoji', emoji: heavy, size: 0.75 },
        { type: 'emoji', emoji: light, size: 0.75 }
      ];
    }
  }
];

/* =========================================================
   画面の要素
   ========================================================= */
const $ = id => document.getElementById(id);
const questionEl = $('question');
const choiceEls = [$('choice0'), $('choice1')];
const feedbackEl = $('feedback');
const blockerEl = $('blocker');
const cooldownEl = $('cooldown');

let current = null;      // いまの問題
let lastConceptId = null;
let locked = false;

/* ---------- 問題を作る ---------- */
function makeQuestion() {
  const pool = CONCEPTS.filter(c => c.id !== lastConceptId);
  const concept = pick(pool);
  lastConceptId = concept.id;

  const items = concept.items();             // [words[0]の絵, words[1]の絵]
  const askIndex = Math.random() < 0.5 ? 0 : 1;   // どちらの言葉で聞くか
  const swap = Math.random() < 0.5;               // 左右を入れかえるか

  const shown = swap ? [items[1], items[0]] : items;
  const correctIndex = swap ? 1 - askIndex : askIndex;
  return { concept, word: concept.words[askIndex], shown, correctIndex };
}

/* ---------- 絵を作る ---------- */
function renderItem(item, maxCount) {
  // 画像があれば画像を使う
  if (item.image) {
    const img = document.createElement('img');
    img.className = 'pic';
    img.src = item.image;
    img.alt = item.alt || '';
    img.draggable = false;
    img.style.setProperty('--s', item.size ?? 0.9);
    return img;
  }
  const el = document.createElement('div');
  switch (item.type) {
    case 'emoji':
      el.className = 'emoji';
      el.textContent = item.emoji;
      el.style.setProperty('--s', item.size);
      break;
    case 'many': {
      el.className = 'many';
      // 2つの選択肢で絵の大きさをそろえる（多いほうの数で決める）
      const cols = Math.ceil(Math.sqrt(maxCount));
      el.style.setProperty('--fs', Math.min(30, 66 / cols) + 'cqmin');
      for (let i = 0; i < item.count; i++) {
        const s = document.createElement('span');
        s.textContent = item.emoji;
        el.appendChild(s);
      }
      break;
    }
    case 'pencil':
      el.className = 'pencil';
      el.style.setProperty('--len', item.length);
      el.style.setProperty('--c', item.color);
      el.innerHTML = '<span class="eraser"></span><span class="band"></span><span class="body"></span><span class="tip"></span>';
      break;
    case 'area':
      el.className = 'area';
      el.style.setProperty('--w', item.w);
      el.style.setProperty('--h', item.h);
      el.style.setProperty('--c', item.color);
      el.textContent = item.emoji || '';
      break;
  }
  return el;
}

/* ---------- 問題を表示 ---------- */
function showQuestion(q) {
  questionEl.innerHTML = 'どっちが <span class="key">' + q.word + '</span>？';
  const maxCount = Math.max(...q.shown.map(it => it.count || 0));
  choiceEls.forEach((btn, i) => {
    btn.className = 'choice' + (q.concept.alignStart ? ' align-start' : '');
    btn.replaceChildren(renderItem(q.shown[i], maxCount));
  });
  feedbackEl.replaceChildren();
}

function nextQuestion() {
  current = makeQuestion();
  showQuestion(current);
  unlock();
}

/* ---------- ロック ---------- */
function lock()   { locked = true;  blockerEl.hidden = false; }
function unlock() { locked = false; blockerEl.hidden = true; }

/* ---------- 〇 × ---------- */
function showMark(kind) {
  const m = document.createElement('div');
  m.className = 'mark ' + kind;
  feedbackEl.replaceChildren(m);
  return m;
}

/* ---------- タッチしたとき ---------- */
function onChoose(index) {
  if (locked || !current) return;
  lock();

  if (index === current.correctIndex) {
    // 正解：〇 ＋ ピンポーン → 次の問題へ
    choiceEls[index].classList.add('is-correct');
    showMark('maru');
    playPingPong();
    setTimeout(nextQuestion, CONFIG.correctWaitMs);
  } else {
    // 不正解：× のみ（音なし）→ 5秒クールタイム → 同じ問題をやり直し
    choiceEls[index].classList.add('is-wrong');
    const mark = showMark('batsu');
    setTimeout(() => mark.classList.add('fade'), CONFIG.batsuFadeMs);

    cooldownEl.style.setProperty('--t', CONFIG.cooldownMs + 'ms');
    cooldownEl.hidden = false;
    cooldownEl.classList.remove('run');
    void cooldownEl.offsetWidth;          // アニメーションをはじめから
    cooldownEl.classList.add('run');

    setTimeout(() => {
      cooldownEl.hidden = true;
      cooldownEl.classList.remove('run');
      showQuestion(current);              // 同じ問題（同じ並び）を表示しなおす
      unlock();
    }, CONFIG.cooldownMs);
  }
}
choiceEls.forEach((btn, i) => btn.addEventListener('click', () => onChoose(i)));

/* =========================================================
   正解音「ピンポーン」（Web Audio APIで生成）
   ========================================================= */
let audioCtx = null;
function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function chime(freq, start, dur) {
  // 基音＋やわらかい倍音で、チャイムらしい音にする
  [[1, 1], [2, 0.18], [3, 0.06]].forEach(([mul, amp]) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * mul;
    const peak = CONFIG.volume * amp;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak, start + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.05);
  });
}
function playPingPong() {
  ensureAudio();
  if (!audioCtx) return;
  const t = audioCtx.currentTime + 0.02;
  chime(880.0, t, 0.55);         // ピン（ラ）
  chime(698.5, t + 0.32, 1.1);   // ポーン（ファ）
}

/* =========================================================
   スタート（最初のタッチで音を使えるようにする）
   ========================================================= */
$('startBtn').addEventListener('click', async () => {
  ensureAudio();
  try { await navigator.wakeLock?.request('screen'); } catch (e) { /* 画面スリープ防止は使えなくてもOK */ }
  $('start').hidden = true;
  nextQuestion();
});

// 長押しメニュー・ダブルタップ拡大を防ぐ
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// スタート画面の後ろに最初の問題を用意しておく
current = makeQuestion();
showQuestion(current);
</script>
</body>
</html>
