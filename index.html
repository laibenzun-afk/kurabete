<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ながさを くらべよう</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* レイアウト：上に質問文、下に横長の選択肢を上から順に並べる（左はしをそろえて長さを比べる）。白地のみ。 */
:root {
  --bg: #ffffff;        /* 背景（白） */
  --ink: #222831;       /* 文字 */
  --sub: #8a94a0;       /* 先生向けの小さな文字 */
  --line: #d3d9e0;      /* 選択肢のふち */
  --press: #eef2f6;     /* 押した瞬間の色 */
  --done: #fff4f0;      /* 上級：タッチできた選択肢の色 */
  --key: #d6450f;       /* 質問文のキーワード */
  --maru: #e03131;      /* 〇 の色 */
  --batsu: #1f5fbf;     /* × の色 */
  --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Hiragino Sans", "Meiryo", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  overflow: hidden; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
#app {
  height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 2vmin;
  padding-inline: max(16px, 3vmin); padding-block: 2vmin 3vmin;
}

/* ---------- 上の段：メニュー・のこり・質問文 ---------- */
#top { display: flex; flex-direction: column; gap: .8vmin; }
#bar { display: flex; justify-content: space-between; align-items: center; gap: 2vmin; }
#question {
  margin: 0; text-align: center; font-weight: 900; line-height: 1.2;
  font-size: clamp(30px, 7vmin, 76px); letter-spacing: .04em;
  text-wrap: balance;
}
#question .key { color: var(--key); }
#question .nw { display: inline-block; white-space: nowrap; }
#progress {
  color: var(--sub); font-size: clamp(14px, 2.6vmin, 24px);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
/* 先生用：長おしでメニューへ（子どもが軽くさわっても戻らない） */
#back {
  position: relative; overflow: hidden;
  background: var(--bg); color: var(--sub); border: 2px solid var(--line); border-radius: 999px;
  font-size: clamp(12px, 2.2vmin, 20px); padding: .4em .9em; cursor: pointer; white-space: nowrap;
}
#back::after {
  content: ""; position: absolute; inset: 0; background: var(--line); opacity: .6;
  transform: scaleX(0); transform-origin: left center;
}
#back.holding::after { transform: scaleX(1); transition: transform var(--hold) linear; }
#back span { position: relative; z-index: 1; }

/* ---------- 選択肢（横長の行を上から並べる） ---------- */
#choices {
  flex: 1; min-height: 0;
  display: grid; grid-template-rows: repeat(var(--n), 1fr); gap: 2vmin;
}
.choice {
  position: relative; min-width: 0; min-height: 0; margin: 0;
  container-type: size;
  display: flex; align-items: center; justify-content: flex-start;
  padding: 0 0 0 4cqw;
  background: var(--bg);
  border: max(4px, .6vmin) solid var(--line); border-radius: 3vmin;
  cursor: pointer; overflow: hidden;
  transition: background-color .1s;
}
.choice:active { background: var(--press); }
.choice:focus-visible { outline: 6px solid var(--key); outline-offset: 4px; }
.choice.is-correct { border-color: var(--maru); }
.choice.is-wrong   { border-color: var(--batsu); }
.choice.is-done    { background: var(--done); border-color: var(--maru); }

/* 上級：タッチした じゅんばん */
.badge {
  position: absolute; right: 2.5cqw; top: 50%; transform: translateY(-50%);
  width: min(60cqh, 10cqw); aspect-ratio: 1; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--maru); color: #fff; font-weight: 900; font-size: min(36cqh, 6cqw); line-height: 1;
}

/* ---------- くらべる物（横の長さ = --len × 80cqw） ---------- */
.obj { width: calc(var(--len) * 80cqw); flex: none; }
.pic { height: auto; max-height: 80cqh; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }

/* えんぴつ */
.pencil { height: 42cqh; display: flex; }
.pencil .eraser { width: 16cqh; background: #f4a6b8; border-radius: 8cqh 0 0 8cqh; flex: none; }
.pencil .band   { width: 6cqh; background: #b8bec6; flex: none; }
.pencil .body   { flex: 1; background: var(--c); }
.pencil .tip {
  width: 28cqh; flex: none;
  background: linear-gradient(to right, #f1d3a6 72%, #3a3a3a 72%);
  clip-path: polygon(0 0, 100% 50%, 0 100%);
}

/* はし（2本） */
.hashi { display: flex; flex-direction: column; gap: 9cqh; }
.hashi span {
  display: block; height: 14cqh;
  background: linear-gradient(to right, var(--c) 0 22%, #c99a6b 22% 100%);
  clip-path: polygon(0 0, 100% 30%, 100% 70%, 0 100%);
}

/* ひも */
.himo {
  height: 18cqh; border-radius: 9cqh;
  background: repeating-linear-gradient(60deg, var(--c) 0 4cqh, #ffffff80 4cqh 5.5cqh);
  background-color: var(--c);
}

/* でんしゃ */
.densha { position: relative; height: 62cqh; }
.densha .car {
  position: absolute; left: 0; right: 0; top: 0; bottom: 12cqh;
  border-radius: 4cqh 20cqh 4cqh 4cqh;
  background:
    linear-gradient(#d8eefc, #d8eefc) right 4cqh top 8cqh / 13cqh 17cqh no-repeat,
    linear-gradient(#f2c94c, #f2c94c) left 0 top 32cqh / 100% 5cqh no-repeat,
    var(--c);
}
.densha .car::before {
  content: ""; position: absolute; left: 5cqh; right: 22cqh; top: 8cqh; height: 17cqh;
  background: repeating-linear-gradient(to right, #d8eefc 0 13cqh, transparent 13cqh 18cqh);
}
.densha .wheels {
  position: absolute; left: 6cqh; right: 12cqh; bottom: 0; height: 13cqh;
  background: radial-gradient(circle, #3a3a3a 0 5.6cqh, transparent 6cqh) left center / 26cqh 13cqh;
  background-repeat: space no-repeat;
}

/* ストロー */
.straw {
  height: 16cqh; border-radius: 4cqh; box-sizing: border-box; border: 2px solid var(--c);
  background: repeating-linear-gradient(to right, var(--c) 0 8cqh, #ffffff 8cqh 16cqh);
}

/* ---------- 〇 × フィードバック ---------- */
#feedback {
  position: fixed; inset: 0; z-index: 10; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
.mark { width: 72vmin; aspect-ratio: 1; max-width: 100%; opacity: .72; animation: pop .35s ease-out both; }
.maru { box-sizing: border-box; border-radius: 50%; border: 10vmin solid var(--maru); }
.batsu { position: relative; }
.batsu::before, .batsu::after {
  content: ""; position: absolute; left: 50%; top: 0;
  width: 10vmin; height: 100%; margin-left: -5vmin;
  background: var(--batsu); border-radius: 5vmin;
}
.batsu::before { transform: rotate(45deg); }
.batsu::after  { transform: rotate(-45deg); }
.mark.fade { opacity: .12; transition: opacity 1s ease; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); } }

/* 操作ロック（クールタイム中など） */
#blocker { position: fixed; inset: 0; z-index: 20; background: transparent; }

/* クールタイムの残り（先生向けの細いバー） */
#cooldown {
  position: fixed; left: 0; bottom: 0; z-index: 21;
  height: max(6px, 1.2vmin); width: 100%; background: var(--line);
  transform-origin: left center;
}
#cooldown.run { animation: shrink var(--t) linear forwards; }
@keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* ---------- スタート画面・おわり画面 ---------- */
.screen {
  position: fixed; inset: 0; z-index: 30; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5vmin; padding-inline: 16px; text-align: center;
}
.screen h1 { margin: 0; font-size: clamp(36px, 9vmin, 100px); font-weight: 900; letter-spacing: .08em; }
.levels { display: flex; flex-wrap: wrap; justify-content: center; gap: 3vmin; }
.level {
  display: flex; flex-direction: column; align-items: center; gap: 1.2vmin;
  min-width: min(30vmin, 60vw); padding: 4vmin 5vmin; cursor: pointer;
  background: var(--bg); border: max(4px, .7vmin) solid var(--line); border-radius: 4vmin;
}
.level:active { background: var(--press); }
.level:focus-visible, .big:focus-visible { outline: 6px solid var(--key); outline-offset: 4px; }
.level .name { font-size: clamp(32px, 8vmin, 80px); font-weight: 900; }
.level .name rt { font-size: .38em; color: var(--sub); }
.level .stars { font-size: clamp(22px, 5vmin, 48px); color: var(--key); letter-spacing: .15em; }
.level .note { font-size: clamp(14px, 2.6vmin, 22px); color: var(--sub); }
.hint { margin: 0; color: var(--sub); font-size: clamp(12px, 2.2vmin, 20px); }
.big {
  font-weight: 900; font-size: clamp(26px, 6vmin, 60px); cursor: pointer;
  border-radius: 999px; padding: 2.5vmin 8vmin;
}
.big.primary { color: #fff; background: var(--key); border: 0; }
.big.secondary { background: var(--bg); border: max(4px, .6vmin) solid var(--line); }
.hanamaru { font-size: min(40vmin, 300px); line-height: 1; }
.end-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 3vmin; }

@media (prefers-reduced-motion: reduce) {
  .mark { animation: none; }
  .mark.fade, #back.holding::after { transition: none; }
}
</style>
</head>
<body>

<div id="app">
  <div id="top">
    <div id="bar">
      <button id="back" type="button" aria-label="長おしでメニューにもどる"><span>メニュー（長おし）</span></button>
      <div id="progress"></div>
    </div>
    <h2 id="question" aria-live="polite"></h2>
  </div>
  <div id="choices"></div>
</div>

<div id="feedback" aria-hidden="true"></div>
<div id="blocker" hidden></div>
<div id="cooldown" hidden></div>

<div id="start" class="screen">
  <h1>ながさを くらべよう</h1>
  <div class="levels" id="levels"></div>
  <p class="hint">せんせいが えらんでください</p>
</div>

<div id="end" class="screen" hidden>
  <div class="hanamaru" aria-hidden="true">💮</div>
  <h1>おわり</h1>
  <div class="end-buttons">
    <button class="big primary" id="againBtn" type="button">もういちど</button>
    <button class="big secondary" id="menuBtn" type="button">なんいどを えらぶ</button>
  </div>
</div>

<script>
/* =========================================================
   せってい（先生が変えられる数値）
   ========================================================= */
const CONFIG = {
  questionsPerGame: 20,  // 1回のもんだい数（正解した数で数える）
  correctWaitMs: 2500,   // 正解後、次の問題へ進むまで
  cooldownMs: 5000,      // 不正解後のクールタイム（操作できない時間）
  batsuFadeMs: 1500,     // × を大きく見せる時間（その後うすくなる）
  backHoldMs: 1200,      // 「メニュー」ボタンを長おしする時間
  volume: 0.28           // 正解音の大きさ（0〜1）
};

/* =========================================================
   なんいど（難易度）
   choices  … 選択肢の数
   mode     … 'pick'（1つえらぶ）または 'order'（ながい じゅんに タッチ）
   lengths  … 長さのセット（1 = いちばん長い）。この中から毎回1つえらぶ
   topRate  … 正解をいちばん上に置く割合（null ならランダム）
   ========================================================= */
const LEVELS = {
  easy: {
    name: '初級', ruby: 'しょきゅう', stars: '★', note: '3たく', choices: 3, mode: 'pick', topRate: 0.7,
    lengths: [[1, 0.62, 0.3], [0.95, 0.6, 0.28], [1, 0.66, 0.34]]
  },
  normal: {
    name: '中級', ruby: 'ちゅうきゅう', stars: '★★', note: '4たく', choices: 4, mode: 'pick', topRate: null,
    lengths: [[1, 0.78, 0.56, 0.34], [0.95, 0.75, 0.55, 0.35], [1, 0.8, 0.6, 0.38]]
  },
  hard: {
    name: '上級', ruby: 'じょうきゅう', stars: '★★★', note: 'ながい じゅんに ならべる', choices: 4, mode: 'order', topRate: null,
    lengths: [[1, 0.78, 0.56, 0.34], [0.95, 0.75, 0.55, 0.35], [1, 0.8, 0.6, 0.38]]
  }
};

/* =========================================================
   くらべる物
   draw(el, color) で物の形を作ります。長さは自動で変わります。
   画像に差し替えるときは、draw の代わりに image を書きます。
     例：{ id: 'pencil', name: 'えんぴつ', image: 'img/pencil.png' }
     （画像は横向きで、左はしから右はしまで物が写っているものにしてください）
   ========================================================= */
const OBJECTS = [
  { id: 'pencil', name: 'えんぴつ', colors: ['#f2c94c', '#6fb3e8', '#7cc576', '#f28c8c'],
    draw(el) { el.innerHTML = '<span class="eraser"></span><span class="band"></span><span class="body"></span><span class="tip"></span>'; } },
  { id: 'hashi', name: 'はし', colors: ['#c0392b', '#2c3e50', '#8e5a2b'],
    draw(el) { el.innerHTML = '<span></span><span></span>'; } },
  { id: 'himo', name: 'ひも', colors: ['#e2a541', '#d9534f', '#5b8fd6'],
    draw() {} },
  { id: 'densha', name: 'でんしゃ', colors: ['#2e8b57', '#d9503f', '#3b7dd8'],
    draw(el) { el.innerHTML = '<span class="car"></span><span class="wheels"></span>'; } },
  { id: 'straw', name: 'ストロー', colors: ['#f28c8c', '#6fb3e8', '#7cc576'],
    draw() {} }
];

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* =========================================================
   画面の要素と状態
   ========================================================= */
const $ = id => document.getElementById(id);
const questionEl = $('question');
const choicesEl = $('choices');
const progressEl = $('progress');
const feedbackEl = $('feedback');
const blockerEl = $('blocker');
const cooldownEl = $('cooldown');

let level = null;        // いまの難易度
let current = null;      // いまの問題
let solved = 0;          // 正解した数
let bag = [];            // 物が かたよらないための袋
let lastObjectId = null;
let locked = false;
const timers = new Set();
function later(fn, ms) {
  const id = setTimeout(() => { timers.delete(id); fn(); }, ms);
  timers.add(id);
}
function clearTimers() { timers.forEach(clearTimeout); timers.clear(); }

/* ---------- 物をえらぶ（同じ物が続かない・かたよらない） ---------- */
function nextObject() {
  if (bag.length === 0) bag = shuffle(OBJECTS);
  if (bag[0].id === lastObjectId && bag.length > 1) bag.push(bag.shift());
  const obj = bag.shift();
  lastObjectId = obj.id;
  return obj;
}

/* ---------- 問題を作る ---------- */
function makeQuestion() {
  const obj = nextObject();
  const color = pick(obj.colors);
  const lens = pick(level.lengths);                 // 長い → 短い の順
  const items = lens.map(len => ({ len }));
  const n = items.length;

  if (level.mode === 'order') {
    const shown = shuffle(items);
    // ながい じゅんに タッチする番号の並び
    const order = shown.map((it, i) => i).sort((a, b) => shown[b].len - shown[a].len);
    return { mode: 'order', obj, color, shown, order, done: [] };
  }

  const word = Math.random() < 0.5 ? 'ながい' : 'みじかい';
  const answer = word === 'ながい' ? items[0] : items[n - 1];
  const others = shuffle(items.filter(it => it !== answer));
  let pos;
  if (level.topRate != null) {
    pos = Math.random() < level.topRate ? 0 : 1 + Math.floor(Math.random() * (n - 1));
  } else {
    pos = Math.floor(Math.random() * n);
  }
  others.splice(pos, 0, answer);
  return { mode: 'pick', obj, color, word, shown: others, correctIndex: pos };
}

/* ---------- 物の絵を作る ---------- */
function renderObject(obj, color, len) {
  if (obj.image) {
    const img = document.createElement('img');
    img.className = 'obj pic';
    img.src = obj.image;
    img.alt = obj.name;
    img.draggable = false;
    img.style.setProperty('--len', len);
    return img;
  }
  const el = document.createElement('div');
  el.className = 'obj ' + obj.id;
  el.setAttribute('role', 'img');
  el.setAttribute('aria-label', obj.name);
  el.style.setProperty('--len', len);
  el.style.setProperty('--c', color);
  obj.draw(el, color);
  return el;
}

/* ---------- 問題を表示 ---------- */
function showQuestion(q) {
  if (q.mode === 'order') {
    questionEl.innerHTML = '<span class="nw"><span class="key">ながい</span> じゅんに</span> <span class="nw">タッチしよう</span>';
  } else {
    const lead = q.shown.length === 2 ? 'どっちが ' : 'どれが いちばん ';
    questionEl.innerHTML = lead + '<span class="nw"><span class="key">' + q.word + '</span>？</span>';
  }
  progressEl.textContent = (solved + 1) + ' / ' + CONFIG.questionsPerGame;
  choicesEl.style.setProperty('--n', q.shown.length);
  choicesEl.replaceChildren(...q.shown.map((item, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice';
    btn.appendChild(renderObject(q.obj, q.color, item.len));
    btn.addEventListener('click', () => onChoose(i));
    return btn;
  }));
  if (q.mode === 'order') q.done.forEach((idx, k) => markDone(idx, k + 1));
  feedbackEl.replaceChildren();
}

function markDone(index, num) {
  const btn = choicesEl.children[index];
  btn.classList.add('is-done');
  const b = document.createElement('span');
  b.className = 'badge';
  b.textContent = num;
  btn.appendChild(b);
}

function nextQuestion() {
  current = makeQuestion();
  showQuestion(current);
  unlock();
}

/* ---------- ロック ---------- */
function lock()   { locked = true;  blockerEl.hidden = false; }
function unlock() { locked = false; blockerEl.hidden = true; }

/* ---------- 〇 × ---------- */
function showMark(kind) {
  const m = document.createElement('div');
  m.className = 'mark ' + kind;
  feedbackEl.replaceChildren(m);
  return m;
}

/* ---------- タッチしたとき ---------- */
function onChoose(index) {
  if (locked || !current) return;
  const btn = choicesEl.children[index];

  if (current.mode === 'order') {
    if (current.done.includes(index)) return;          // もうタッチした物は何もしない
    if (index === current.order[current.done.length]) {
      current.done.push(index);
      markDone(index, current.done.length);
      if (current.done.length === current.shown.length) success(btn);
      return;
    }
    wrong(btn);
    return;
  }

  if (index === current.correctIndex) success(btn);
  else wrong(btn);
}

// 正解：〇 ＋ ピンポーン → 次の問題（さいごなら おわり）
function success(btn) {
  lock();
  if (current.mode === 'pick') btn.classList.add('is-correct');
  showMark('maru');
  playPingPong();
  solved++;
  later(solved >= CONFIG.questionsPerGame ? showEnd : nextQuestion, CONFIG.correctWaitMs);
}

// 不正解：× のみ（音なし）→ 5秒クールタイム → 同じ問題をやり直し
// （上級は、それまでに正しくタッチできた分はのこしたまま、つづきから）
function wrong(btn) {
  lock();
  btn.classList.add('is-wrong');
  const mark = showMark('batsu');
  later(() => mark.classList.add('fade'), CONFIG.batsuFadeMs);

  cooldownEl.style.setProperty('--t', CONFIG.cooldownMs + 'ms');
  cooldownEl.hidden = false;
  cooldownEl.classList.remove('run');
  void cooldownEl.offsetWidth;          // アニメーションをはじめから
  cooldownEl.classList.add('run');

  later(() => {
    cooldownEl.hidden = true;
    cooldownEl.classList.remove('run');
    showQuestion(current);              // 同じ問題（同じ並び）を表示しなおす
    unlock();
  }, CONFIG.cooldownMs);
}

/* =========================================================
   ゲームの はじめ・おわり・メニュー
   ========================================================= */
function startGame(key) {
  ensureAudio();
  requestWakeLock();
  clearTimers();
  level = LEVELS[key];
  level.key = key;
  solved = 0; bag = []; lastObjectId = null;
  cooldownEl.hidden = true;
  $('start').hidden = true;
  $('end').hidden = true;
  nextQuestion();
}
function showEnd() {
  clearTimers();
  feedbackEl.replaceChildren();
  unlock();
  $('end').hidden = false;
}
function showMenu() {
  clearTimers();
  feedbackEl.replaceChildren();
  cooldownEl.hidden = true;
  unlock();
  current = null;
  $('end').hidden = true;
  $('start').hidden = false;
}

// スタート画面の なんいどボタン
$('levels').replaceChildren(...Object.entries(LEVELS).map(([key, lv]) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'level';
  b.innerHTML = '<span class="name"><ruby>' + lv.name + '<rt>' + lv.ruby + '</rt></ruby></span>' +
                '<span class="stars">' + lv.stars + '</span>' +
                '<span class="note">' + lv.note + '</span>';
  b.addEventListener('click', () => startGame(key));
  return b;
}));
$('againBtn').addEventListener('click', () => startGame(level.key));
$('menuBtn').addEventListener('click', showMenu);

// 「メニュー」ボタン：長おしで もどる
(() => {
  const back = $('back');
  let holdTimer = null;
  back.style.setProperty('--hold', CONFIG.backHoldMs + 'ms');
  const cancel = () => { clearTimeout(holdTimer); back.classList.remove('holding'); };
  back.addEventListener('pointerdown', e => {
    e.preventDefault();
    back.classList.add('holding');
    holdTimer = setTimeout(() => { cancel(); showMenu(); }, CONFIG.backHoldMs);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => back.addEventListener(t, cancel));
})();

/* =========================================================
   正解音「ピンポーン」（Web Audio APIで生成）
   ========================================================= */
let audioCtx = null;
function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function chime(freq, start, dur) {
  // 基音＋やわらかい倍音で、チャイムらしい音にする
  [[1, 1], [2, 0.18], [3, 0.06]].forEach(([mul, amp]) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * mul;
    const peak = CONFIG.volume * amp;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak, start + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.05);
  });
}
function playPingPong() {
  ensureAudio();
  if (!audioCtx) return;
  const t = audioCtx.currentTime + 0.02;
  chime(880.0, t, 0.55);         // ピン（ラ）
  chime(698.5, t + 0.32, 1.1);   // ポーン（ファ）
}

// 画面が消えないようにする（使えない端末では何もしない）
async function requestWakeLock() {
  try { await navigator.wakeLock?.request('screen'); } catch (e) { /* なくてもOK */ }
}

// 長押しメニュー・ダブルタップ拡大を防ぐ
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
