<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>くらべてみよう</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* レイアウト：上に質問文、下に大きな選択肢（2択または3択）。白地のみ・装飾なし。 */
:root {
  --bg: #ffffff;        /* 背景（白） */
  --ink: #222831;       /* 文字 */
  --sub: #8a94a0;       /* 先生向けの小さな文字 */
  --line: #d3d9e0;      /* 選択肢のふち */
  --press: #eef2f6;     /* 押した瞬間の色 */
  --key: #d6450f;       /* 質問文のキーワード（おおきい 等） */
  --maru: #e03131;      /* 〇 の色 */
  --batsu: #1f5fbf;     /* × の色 */
  --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Hiragino Sans", "Meiryo", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  overflow: hidden; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
#app {
  height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 2.5vmin;
  padding-inline: max(16px, 3vmin); padding-block: 2vmin 3vmin;
}

/* ---------- 上の段：もどる・質問文・のこり ---------- */
#top { display: flex; flex-direction: column; gap: .8vmin; }
#bar { display: flex; justify-content: space-between; align-items: center; gap: 2vmin; }
#question {
  margin: 0; text-align: center; font-weight: 900; line-height: 1.2;
  font-size: clamp(30px, 7.5vmin, 80px); letter-spacing: .04em;
  text-wrap: balance;
}
#question .key { color: var(--key); }
#progress {
  color: var(--sub); font-size: clamp(14px, 2.6vmin, 24px);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
/* 先生用：長おしでメニューへ（子どもが軽くさわっても戻らない） */
#back {
  position: relative; overflow: hidden;
  background: var(--bg); color: var(--sub); border: 2px solid var(--line); border-radius: 999px;
  font-size: clamp(12px, 2.2vmin, 20px); padding: .4em .9em; cursor: pointer; white-space: nowrap;
}
#back::after {
  content: ""; position: absolute; inset: 0; background: var(--line); opacity: .6;
  transform: scaleX(0); transform-origin: left center;
}
#back.holding::after { transform: scaleX(1); transition: transform var(--hold) linear; }
#back span { position: relative; z-index: 1; }

/* ---------- 選択肢 ---------- */
#choices {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 3vmin;
}
@media (orientation: portrait) {
  #choices { grid-template-columns: 1fr; grid-template-rows: repeat(var(--n), 1fr); }
}
.choice {
  position: relative; min-width: 0; min-height: 0; margin: 0; padding: 0;
  container-type: size;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  border: max(4px, .7vmin) solid var(--line); border-radius: 4vmin;
  cursor: pointer; overflow: hidden;
  transition: background-color .1s;
}
.choice:active { background: var(--press); }
.choice:focus-visible { outline: 6px solid var(--key); outline-offset: 4px; }
.choice.is-correct { border-color: var(--maru); }
.choice.is-wrong   { border-color: var(--batsu); }
.choice.align-start { justify-content: flex-start; padding-left: 6cqw; }

/* 絵文字（大きさは --s ＝ 0〜1 で指定） */
.emoji { font-size: calc(var(--s) * 78cqmin); line-height: 1; }

/* 画像に差し替えたとき（--s で大きさ） */
.pic {
  width: calc(var(--s) * 92cqw); height: calc(var(--s) * 92cqh);
  object-fit: contain; pointer-events: none; -webkit-user-drag: none;
}

/* おおい・すくない：同じ大きさの絵文字を並べる */
.many {
  width: 92%; display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
  gap: 2cqmin 4cqmin; font-size: var(--fs); line-height: 1;
}

/* ながい・みじかい：えんぴつ */
.pencil { width: calc(var(--len) * 86cqw); height: 15cqmin; display: flex; }
.pencil .eraser { width: 8cqmin; background: #f4a6b8; border-radius: 3cqmin 0 0 3cqmin; flex: none; }
.pencil .band   { width: 3cqmin; background: #b8bec6; flex: none; }
.pencil .body   { flex: 1; background: var(--c); }
.pencil .tip {
  width: 13cqmin; flex: none;
  background: linear-gradient(to right, #f1d3a6 72%, #3a3a3a 72%);
  clip-path: polygon(0 0, 100% 50%, 0 100%);
}

/* ひろい・せまい：同じ大きさの人と、広さのちがう場所 */
.area {
  width: calc(var(--w) * 90cqw); height: calc(var(--h) * 90cqh);
  background: var(--c); border-radius: 3cqmin;
  display: flex; align-items: center; justify-content: center;
  font-size: 15cqmin; line-height: 1;
}

/* ---------- 〇 × フィードバック ---------- */
#feedback {
  position: fixed; inset: 0; z-index: 10; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
.mark { width: 72vmin; aspect-ratio: 1; max-width: 100%; opacity: .72; animation: pop .35s ease-out both; }
.maru { box-sizing: border-box; border-radius: 50%; border: 10vmin solid var(--maru); }
.batsu { position: relative; }
.batsu::before, .batsu::after {
  content: ""; position: absolute; left: 50%; top: 0;
  width: 10vmin; height: 100%; margin-left: -5vmin;
  background: var(--batsu); border-radius: 5vmin;
}
.batsu::before { transform: rotate(45deg); }
.batsu::after  { transform: rotate(-45deg); }
.mark.fade { opacity: .12; transition: opacity 1s ease; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); } }

/* 操作ロック（クールタイム中など） */
#blocker { position: fixed; inset: 0; z-index: 20; background: transparent; }

/* クールタイムの残り（先生向けの細いバー） */
#cooldown {
  position: fixed; left: 0; bottom: 0; z-index: 21;
  height: max(6px, 1.2vmin); width: 100%; background: var(--line);
  transform-origin: left center;
}
#cooldown.run { animation: shrink var(--t) linear forwards; }
@keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* ---------- スタート画面・おわり画面 ---------- */
.screen {
  position: fixed; inset: 0; z-index: 30; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5vmin; padding-inline: 16px; text-align: center;
}
.screen h1 { margin: 0; font-size: clamp(40px, 10vmin, 110px); font-weight: 900; letter-spacing: .08em; }
.levels { display: flex; flex-wrap: wrap; justify-content: center; gap: 3vmin; }
.level {
  display: flex; flex-direction: column; align-items: center; gap: 1.2vmin;
  min-width: min(30vmin, 60vw); padding: 4vmin 5vmin; cursor: pointer;
  background: var(--bg); border: max(4px, .7vmin) solid var(--line); border-radius: 4vmin;
}
.level:active { background: var(--press); }
.level:focus-visible, .big:focus-visible { outline: 6px solid var(--key); outline-offset: 4px; }
.level .name { font-size: clamp(32px, 8vmin, 80px); font-weight: 900; }
.level .name rt { font-size: .38em; color: var(--sub); }
.level .stars { font-size: clamp(22px, 5vmin, 48px); color: var(--key); letter-spacing: .15em; }
.level .note { font-size: clamp(14px, 2.6vmin, 22px); color: var(--sub); }
.hint { margin: 0; color: var(--sub); font-size: clamp(12px, 2.2vmin, 20px); }
.big {
  font-weight: 900; font-size: clamp(26px, 6vmin, 60px); cursor: pointer;
  border-radius: 999px; padding: 2.5vmin 8vmin;
}
.big.primary { color: #fff; background: var(--key); border: 0; }
.big.secondary { background: var(--bg); border: max(4px, .6vmin) solid var(--line); }
.hanamaru { font-size: min(40vmin, 300px); line-height: 1; }
.end-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 3vmin; }

@media (prefers-reduced-motion: reduce) {
  .mark { animation: none; }
  .mark.fade, #back.holding::after { transition: none; }
}
</style>
</head>
<body>

<div id="app">
  <div id="top">
    <div id="bar">
      <button id="back" type="button" aria-label="長おしでメニューにもどる"><span>メニュー（長おし）</span></button>
      <div id="progress"></div>
    </div>
    <h2 id="question" aria-live="polite"></h2>
  </div>
  <div id="choices"></div>
</div>

<div id="feedback" aria-hidden="true"></div>
<div id="blocker" hidden></div>
<div id="cooldown" hidden></div>

<div id="start" class="screen">
  <h1>くらべてみよう</h1>
  <div class="levels" id="levels"></div>
  <p class="hint">せんせいが えらんでください</p>
</div>

<div id="end" class="screen" hidden>
  <div class="hanamaru" aria-hidden="true">💮</div>
  <h1>おわり</h1>
  <div class="end-buttons">
    <button class="big primary" id="againBtn" type="button">もういちど</button>
    <button class="big secondary" id="menuBtn" type="button">なんいどを えらぶ</button>
  </div>
</div>

<script>
/* =========================================================
   せってい（先生が変えられる数値）
   ========================================================= */
const CONFIG = {
  questionsPerGame: 30,  // 1回のもんだい数（正解した数で数える）
  correctWaitMs: 2500,   // 正解後、次の問題へ進むまで
  cooldownMs: 5000,      // 不正解後のクールタイム（操作できない時間）
  batsuFadeMs: 1500,     // × を大きく見せる時間（その後うすくなる）
  backHoldMs: 1200,      // 「メニュー」ボタンを長おしする時間
  volume: 0.28           // 正解音の大きさ（0〜1）
};

/* =========================================================
   なんいど（難易度）
   choices    … 選択肢の数（2 または 3）
   concepts   … 出す問題の種類（下の CONCEPTS の id）
   leftRate   … 正解をいちばん左に置く割合（null ならランダム）
   ========================================================= */
const LEVELS = {
  easy:   { name: '初級', ruby: 'しょきゅう',   stars: '★',   note: '2たく・おもさ なし', choices: 2,
            concepts: ['size', 'length', 'width', 'amount'], leftRate: 0.7 },
  normal: { name: '中級', ruby: 'ちゅうきゅう', stars: '★★',  note: '2たく',              choices: 2,
            concepts: ['size', 'length', 'width', 'amount', 'weight'], leftRate: null },
  hard:   { name: '上級', ruby: 'じょうきゅう', stars: '★★★', note: '3たく',              choices: 3,
            concepts: ['size', 'length', 'width', 'amount', 'weight'], leftRate: null }
};

/* =========================================================
   選択肢の「見た目」の書き方
   ---------------------------------------------------------
   どの選択肢も、次のどれかのオブジェクトで表します。
   画像に差し替えるときは image を足すだけでOK
   （image があれば絵文字より優先して表示されます）。

   { type:'emoji',  emoji:'🍎', size:0.9 }          … 1つの絵（size 0〜1）
   { type:'many',   emoji:'🍎', count:6 }           … 同じ絵を count 個
   { type:'pencil', length:0.9, color:'#f2c94c' }   … えんぴつ（length 0〜1）
   { type:'area',   w:0.9, h:0.8, color:'#bfe3b4', emoji:'🧒' } … 場所の広さ
   { image:'img/apple.png', size:0.9, alt:'りんご' } … 画像（size 0〜1）
   ========================================================= */

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

/* =========================================================
   問題のデータ
   items(n) は n こ（2 または 3）の絵を返します。
   ならびは「words[0] がいちばん強い → words[1] がいちばん強い」の順。
   例：words:['おおきい','ちいさい'] なら [大きい, (中くらい), 小さい]
   ========================================================= */
const CONCEPTS = [
  {
    id: 'size',
    words: ['おおきい', 'ちいさい'],
    items(n) {
      const e = pick(['🍎', '🐶', '⚽', '🍙', '🚗', '🐟', '🌻']);
      const sizes = n === 3 ? [0.9, 0.58, 0.28] : [0.9, 0.35];
      return sizes.map(size => ({ type: 'emoji', emoji: e, size }));
    }
  },
  {
    id: 'length',
    words: ['ながい', 'みじかい'],
    items(n) {
      const c = pick(['#f2c94c', '#6fb3e8', '#7cc576', '#f28c8c']);
      const lens = n === 3 ? [0.95, 0.68, 0.42] : [0.95, 0.42];
      return lens.map(length => ({ type: 'pencil', length, color: c }));
    },
    alignStart: true   // 左はしをそろえて比べやすくする
  },
  {
    id: 'width',
    words: ['ひろい', 'せまい'],
    items(n) {
      const [color, emoji] = pick([['#bfe3b4', '🧒'], ['#bfe0f5', '🐟'], ['#f3dfc1', '🐱']]);
      const boxes = n === 3 ? [[0.92, 0.85], [0.62, 0.6], [0.32, 0.36]] : [[0.92, 0.85], [0.32, 0.38]];
      return boxes.map(([w, h]) => ({ type: 'area', w, h, color, emoji }));
    }
  },
  {
    id: 'amount',
    words: ['おおい', 'すくない'],
    items(n) {
      const e = pick(['🍎', '🍓', '⭐', '🐟', '🍬', '🌷']);
      const counts = n === 3
        ? pick([[9, 5, 2], [8, 4, 1], [7, 4, 2], [9, 6, 3]])
        : pick([[8, 2], [7, 1], [6, 2], [9, 3]]);
      return counts.map(count => ({ type: 'many', emoji: e, count }));
    }
  },
  {
    id: 'weight',
    words: ['おもい', 'かるい'],
    items(n) {
      const set = n === 3
        ? pick([['🐘', '🐶', '🐭'], ['🚗', '🚲', '🪶'], ['🍉', '🍎', '🍓'], ['🐻', '🐱', '🐦'], ['🪨', '🍙', '🪶']])
        : pick([['🐘', '🐭'], ['🚗', '🚲'], ['🍉', '🍓'], ['🪨', '🪶'], ['🐻', '🐦']]);
      return set.map(emoji => ({ type: 'emoji', emoji, size: 0.72 }));
    }
  }
];
const conceptById = id => CONCEPTS.find(c => c.id === id);

/* =========================================================
   画面の要素と状態
   ========================================================= */
const $ = id => document.getElementById(id);
const questionEl = $('question');
const choicesEl = $('choices');
const progressEl = $('progress');
const feedbackEl = $('feedback');
const blockerEl = $('blocker');
const cooldownEl = $('cooldown');

let level = null;        // いまの難易度
let current = null;      // いまの問題
let solved = 0;          // 正解した数
let bag = [];            // 問題の種類が かたよらないための袋
let lastConceptId = null;
let locked = false;
const timers = new Set();
function later(fn, ms) {
  const id = setTimeout(() => { timers.delete(id); fn(); }, ms);
  timers.add(id);
}
function clearTimers() { timers.forEach(clearTimeout); timers.clear(); }

/* ---------- 問題の種類をえらぶ（同じ種類が続かない・かたよらない） ---------- */
function nextConcept() {
  if (bag.length === 0) bag = shuffle(level.concepts);
  if (bag[0] === lastConceptId && bag.length > 1) bag.push(bag.shift());
  const id = bag.shift();
  lastConceptId = id;
  return conceptById(id);
}

/* ---------- 問題を作る ---------- */
function makeQuestion() {
  const concept = nextConcept();
  const n = level.choices;
  const items = concept.items(n);
  const askIndex = Math.random() < 0.5 ? 0 : 1;        // どちらの言葉で聞くか
  const answer = askIndex === 0 ? items[0] : items[n - 1];
  const others = items.filter(it => it !== answer);

  // 正解の位置を決める
  let pos;
  if (level.leftRate != null) {
    pos = Math.random() < level.leftRate ? 0 : 1 + Math.floor(Math.random() * (n - 1));
  } else {
    pos = Math.floor(Math.random() * n);
  }
  const shown = shuffle(others);
  shown.splice(pos, 0, answer);

  return { concept, word: concept.words[askIndex], shown, correctIndex: pos };
}

/* ---------- 絵を作る ---------- */
function renderItem(item, maxCount) {
  // 画像があれば画像を使う
  if (item.image) {
    const img = document.createElement('img');
    img.className = 'pic';
    img.src = item.image;
    img.alt = item.alt || '';
    img.draggable = false;
    img.style.setProperty('--s', item.size ?? 0.9);
    return img;
  }
  const el = document.createElement('div');
  switch (item.type) {
    case 'emoji':
      el.className = 'emoji';
      el.textContent = item.emoji;
      el.style.setProperty('--s', item.size);
      break;
    case 'many': {
      el.className = 'many';
      // 選択肢どうしで絵の大きさをそろえる（いちばん多い数で決める）
      const cols = Math.ceil(Math.sqrt(maxCount));
      el.style.setProperty('--fs', Math.min(30, 66 / cols) + 'cqmin');
      for (let i = 0; i < item.count; i++) {
        const s = document.createElement('span');
        s.textContent = item.emoji;
        el.appendChild(s);
      }
      break;
    }
    case 'pencil':
      el.className = 'pencil';
      el.style.setProperty('--len', item.length);
      el.style.setProperty('--c', item.color);
      el.innerHTML = '<span class="eraser"></span><span class="band"></span><span class="body"></span><span class="tip"></span>';
      break;
    case 'area':
      el.className = 'area';
      el.style.setProperty('--w', item.w);
      el.style.setProperty('--h', item.h);
      el.style.setProperty('--c', item.color);
      el.textContent = item.emoji || '';
      break;
  }
  return el;
}

/* ---------- 問題を表示 ---------- */
function showQuestion(q) {
  const lead = q.shown.length === 3 ? 'どれが いちばん ' : 'どっちが ';
  questionEl.innerHTML = lead + '<span class="key">' + q.word + '</span>？';
  progressEl.textContent = (solved + 1) + ' / ' + CONFIG.questionsPerGame;
  const maxCount = Math.max(...q.shown.map(it => it.count || 0));
  choicesEl.style.setProperty('--n', q.shown.length);
  choicesEl.replaceChildren(...q.shown.map((item, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice' + (q.concept.alignStart ? ' align-start' : '');
    btn.appendChild(renderItem(item, maxCount));
    btn.addEventListener('click', () => onChoose(i));
    return btn;
  }));
  feedbackEl.replaceChildren();
}

function nextQuestion() {
  current = makeQuestion();
  showQuestion(current);
  unlock();
}

/* ---------- ロック ---------- */
function lock()   { locked = true;  blockerEl.hidden = false; }
function unlock() { locked = false; blockerEl.hidden = true; }

/* ---------- 〇 × ---------- */
function showMark(kind) {
  const m = document.createElement('div');
  m.className = 'mark ' + kind;
  feedbackEl.replaceChildren(m);
  return m;
}

/* ---------- タッチしたとき ---------- */
function onChoose(index) {
  if (locked || !current) return;
  lock();
  const btn = choicesEl.children[index];

  if (index === current.correctIndex) {
    // 正解：〇 ＋ ピンポーン → 次の問題（30問めなら おわり）
    btn.classList.add('is-correct');
    showMark('maru');
    playPingPong();
    solved++;
    later(solved >= CONFIG.questionsPerGame ? showEnd : nextQuestion, CONFIG.correctWaitMs);
  } else {
    // 不正解：× のみ（音なし）→ 5秒クールタイム → 同じ問題をやり直し
    btn.classList.add('is-wrong');
    const mark = showMark('batsu');
    later(() => mark.classList.add('fade'), CONFIG.batsuFadeMs);

    cooldownEl.style.setProperty('--t', CONFIG.cooldownMs + 'ms');
    cooldownEl.hidden = false;
    cooldownEl.classList.remove('run');
    void cooldownEl.offsetWidth;          // アニメーションをはじめから
    cooldownEl.classList.add('run');

    later(() => {
      cooldownEl.hidden = true;
      cooldownEl.classList.remove('run');
      showQuestion(current);              // 同じ問題（同じ並び）を表示しなおす
      unlock();
    }, CONFIG.cooldownMs);
  }
}

/* =========================================================
   ゲームの はじめ・おわり・メニュー
   ========================================================= */
function startGame(key) {
  ensureAudio();
  requestWakeLock();
  clearTimers();
  level = LEVELS[key];
  level.key = key;
  solved = 0; bag = []; lastConceptId = null;
  cooldownEl.hidden = true;
  $('start').hidden = true;
  $('end').hidden = true;
  nextQuestion();
}
function showEnd() {
  clearTimers();
  feedbackEl.replaceChildren();
  unlock();
  $('end').hidden = false;
}
function showMenu() {
  clearTimers();
  feedbackEl.replaceChildren();
  cooldownEl.hidden = true;
  unlock();
  current = null;
  $('end').hidden = true;
  $('start').hidden = false;
}

// スタート画面の なんいどボタン
$('levels').replaceChildren(...Object.entries(LEVELS).map(([key, lv]) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'level';
  b.innerHTML = '<span class="name"><ruby>' + lv.name + '<rt>' + lv.ruby + '</rt></ruby></span>' +
                '<span class="stars">' + lv.stars + '</span>' +
                '<span class="note">' + lv.note + '</span>';
  b.addEventListener('click', () => startGame(key));
  return b;
}));
$('againBtn').addEventListener('click', () => startGame(level.key));
$('menuBtn').addEventListener('click', showMenu);

// 「メニュー」ボタン：長おしで もどる
(() => {
  const back = $('back');
  let holdTimer = null;
  back.style.setProperty('--hold', CONFIG.backHoldMs + 'ms');
  const cancel = () => { clearTimeout(holdTimer); back.classList.remove('holding'); };
  back.addEventListener('pointerdown', e => {
    e.preventDefault();
    back.classList.add('holding');
    holdTimer = setTimeout(() => { cancel(); showMenu(); }, CONFIG.backHoldMs);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => back.addEventListener(t, cancel));
})();

/* =========================================================
   正解音「ピンポーン」（Web Audio APIで生成）
   ========================================================= */
let audioCtx = null;
function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function chime(freq, start, dur) {
  // 基音＋やわらかい倍音で、チャイムらしい音にする
  [[1, 1], [2, 0.18], [3, 0.06]].forEach(([mul, amp]) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * mul;
    const peak = CONFIG.volume * amp;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak, start + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.05);
  });
}
function playPingPong() {
  ensureAudio();
  if (!audioCtx) return;
  const t = audioCtx.currentTime + 0.02;
  chime(880.0, t, 0.55);         // ピン（ラ）
  chime(698.5, t + 0.32, 1.1);   // ポーン（ファ）
}

// 画面が消えないようにする（使えない端末では何もしない）
async function requestWakeLock() {
  try { await navigator.wakeLock?.request('screen'); } catch (e) { /* なくてもOK */ }
}

// 長押しメニュー・ダブルタップ拡大を防ぐ
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
